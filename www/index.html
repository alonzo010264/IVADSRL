<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>IVAD Home & Goods — App Móvil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #12273d;
            --primary-dark: #091624;
            --accent-gold: #bfa687;
            --accent-gold-dark: #9c8366;
            --bg-body: #f6f8fa;
            --surface: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius-lg: 20px;
            --radius-md: 14px;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.03);
            --shadow-md: 0 8px 24px rgba(18,39,61,0.08);
            --safe-area-bottom: env(safe-area-inset-bottom, 0px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Outfit', sans-serif; background: var(--bg-body); color: var(--text-dark); overflow-x: hidden; padding-bottom: calc(75px + var(--safe-area-bottom)); -webkit-font-smoothing: antialiased; }

        /* HEADER */
        .app-header { background: var(--primary); color: #fff; padding: 16px 20px 14px; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,0.15); border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .brand-box { display: flex; align-items: center; gap: 12px; }
        .brand-box img { width: 44px; height: 44px; border-radius: 12px; object-fit: contain; background: #fff; padding: 3px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .brand-text h1 { font-size: 1.15rem; font-weight: 900; letter-spacing: 1px; color: #fff; line-height: 1.1; }
        .brand-text p { font-size: 0.65rem; color: var(--accent-gold); font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }

        .header-actions { display: flex; align-items: center; gap: 10px; }
        .icon-btn { width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; cursor: pointer; position: relative; transition: all 0.2s; }
        .icon-btn .badge { position: absolute; top: -4px; right: -4px; background: #ef4444; color: #fff; font-size: 0.65rem; font-weight: 800; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid var(--primary); }

        /* SEARCH BAR */
        .search-container { position: relative; }
        .search-container i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.5); font-size: 0.95rem; }
        .search-container input { width: 100%; padding: 12px 14px 12px 42px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); border-radius: 14px; color: #fff; font-family: inherit; font-size: 0.88rem; outline: none; transition: all 0.2s; }
        .search-container input::placeholder { color: rgba(255,255,255,0.5); }
        .search-container input:focus { background: rgba(255,255,255,0.2); border-color: var(--accent-gold); }

        /* HERO BANNER CAROUSEL */
        .banner-wrapper { padding: 16px 20px 8px; }
        .hero-card { background: linear-gradient(135deg, var(--primary) 0%, #1a365d 100%); border-radius: var(--radius-lg); padding: 20px; color: #fff; position: relative; overflow: hidden; box-shadow: var(--shadow-md); border: 1px solid rgba(191,166,135,0.2); }
        .hero-card::after { content: ''; position: absolute; right: -30px; bottom: -30px; width: 160px; height: 160px; background: radial-gradient(circle, rgba(191,166,135,0.2) 0%, transparent 70%); border-radius: 50%; pointer-events: none; }
        .hero-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; background: rgba(191,166,135,0.2); border: 1px solid var(--accent-gold); border-radius: 20px; font-size: 0.68rem; font-weight: 800; color: var(--accent-gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .hero-card h2 { font-size: 1.35rem; font-weight: 800; margin-bottom: 6px; line-height: 1.25; }
        .hero-card p { font-size: 0.82rem; color: rgba(255,255,255,0.75); margin-bottom: 14px; max-width: 75%; }
        .hero-btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; background: var(--accent-gold); color: var(--primary-dark); border-radius: 12px; font-weight: 800; font-size: 0.82rem; border: none; cursor: pointer; transition: transform 0.2s; }
        .hero-btn:active { transform: scale(0.96); }

        /* CATEGORIES BAR */
        .section-title { padding: 16px 20px 10px; display: flex; justify-content: space-between; align-items: center; }
        .section-title h3 { font-size: 1.05rem; font-weight: 800; color: var(--text-dark); display: flex; align-items: center; gap: 8px; }
        .section-title h3 i { color: var(--accent-gold-dark); }
        .section-title span { font-size: 0.78rem; font-weight: 700; color: var(--accent-gold-dark); cursor: pointer; }

        .categories-scroll { display: flex; gap: 10px; padding: 0 20px 10px; overflow-x: auto; scrollbar-width: none; }
        .categories-scroll::-webkit-scrollbar { display: none; }
        .cat-chip { padding: 10px 18px; background: var(--surface); border: 1.5px solid var(--border); border-radius: 25px; font-size: 0.82rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px; box-shadow: var(--shadow-sm); }
        .cat-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: var(--shadow-md); }
        .cat-chip.active i { color: var(--accent-gold); }

        /* BRANDS SCROLL */
        .brands-scroll { display: flex; gap: 10px; padding: 0 20px 14px; overflow-x: auto; scrollbar-width: none; }
        .brands-scroll::-webkit-scrollbar { display: none; }
        .brand-chip { padding: 8px 14px; background: var(--surface); border: 1.5px solid var(--border); border-radius: 14px; font-size: 0.75rem; font-weight: 800; color: var(--text-dark); white-space: nowrap; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .brand-chip.active { border-color: var(--accent-gold); background: rgba(191,166,135,0.12); color: var(--accent-gold-dark); }

        /* PRODUCTS GRID */
        .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; padding: 0 20px; }
        .product-card { background: var(--surface); border-radius: var(--radius-md); padding: 12px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); display: flex; flex-direction: column; justify-content: space-between; position: relative; transition: transform 0.2s, box-shadow 0.2s; }
        .product-card:active { transform: scale(0.98); }
        .prod-img-wrap { width: 100%; height: 130px; background: #f8fafc; border-radius: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 10px; border: 1px solid #f1f5f9; }
        .prod-img-wrap img { max-width: 90%; max-height: 90%; object-fit: contain; }
        .prod-brand { font-size: 0.65rem; font-weight: 800; color: var(--accent-gold-dark); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
        .prod-title { font-size: 0.88rem; font-weight: 700; color: var(--text-dark); line-height: 1.25; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .prod-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
        .prod-price { font-size: 0.95rem; font-weight: 900; color: var(--primary); }
        .btn-add-cart { width: 34px; height: 34px; border-radius: 10px; background: var(--primary); color: #fff; border: none; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
        .btn-add-cart:active { background: var(--accent-gold); }

        /* LOYALTY CARD */
        .loyalty-banner { margin: 20px; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); border-radius: var(--radius-lg); padding: 18px 20px; color: #fff; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(191,166,135,0.3); box-shadow: var(--shadow-md); }
        .loyalty-info h4 { font-size: 0.95rem; font-weight: 800; color: var(--accent-gold); }
        .loyalty-info p { font-size: 0.75rem; color: rgba(255,255,255,0.7); margin-top: 2px; }
        .pts-badge { background: rgba(191,166,135,0.2); border: 1px solid var(--accent-gold); padding: 6px 14px; border-radius: 20px; font-size: 1.1rem; font-weight: 900; color: var(--accent-gold); }

        /* BOTTOM NAVBAR */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); padding: 8px 16px calc(8px + var(--safe-area-bottom)); display: flex; justify-content: space-around; align-items: center; z-index: 200; box-shadow: 0 -4px 20px rgba(0,0,0,0.06); }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; color: var(--text-muted); font-family: inherit; font-size: 0.68rem; font-weight: 700; cursor: pointer; transition: all 0.2s; position: relative; }
        .nav-item i { font-size: 1.25rem; }
        .nav-item.active { color: var(--primary); }
        .nav-item.active i { color: var(--accent-gold-dark); transform: translateY(-2px); }

        /* MODAL SHEET */
        .modal-sheet { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 300; display: none; justify-content: flex-end; flex-direction: column; }
        .modal-sheet.open { display: flex; animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .sheet-content { background: var(--surface); border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 24px 20px calc(24px + var(--safe-area-bottom)); max-height: 85vh; overflow-y: auto; position: relative; }
        .sheet-handle { width: 40px; height: 4px; background: #cbd5e1; border-radius: 2px; margin: 0 auto 16px; }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="app-header">
        <div class="header-top">
            <div class="brand-box">
                <img src="images/app_icon.jpg" alt="IVAD Logo" onerror="this.src='logo.png'">
                <div class="brand-text">
                    <h1>IVAD</h1>
                    <p>Home & Goods</p>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" onclick="openCartModal()">
                    <i class="fas fa-shopping-bag"></i>
                    <span class="badge" id="cartBadgeCount">0</span>
                </button>
            </div>
        </div>
        <div class="search-container">
            <i class="fas fa-search"></i>
            <input type="text" id="appSearchInput" placeholder="Buscar productos, desechables, marcas..." oninput="onAppSearch(this.value)">
        </div>
    </header>

    <!-- HERO PROMO BANNER -->
    <div class="banner-wrapper">
        <div class="hero-card">
            <span class="hero-badge"><i class="fas fa-star"></i> Catálogo 2026</span>
            <h2>Desechables & Vajilla Premium</h2>
            <p>Platos, vasos y empaques biodegradables directo a tu puerta.</p>
            <button class="hero-btn" onclick="filterCategory('desechables')">
                <i class="fas fa-shopping-cart"></i> Explorar Colección
            </button>
        </div>
    </div>

    <!-- LOYALTY POINTS BANNER -->
    <div class="loyalty-banner">
        <div class="loyalty-info">
            <h4><i class="fas fa-crown"></i> IVAD Fidelización</h4>
            <p>Acumula puntos en cada compra</p>
        </div>
        <div class="pts-badge" id="userPtsBadge">150 PTS</div>
    </div>

    <!-- CATEGORIES -->
    <div class="section-title">
        <h3><i class="fas fa-th-large"></i> Categorías</h3>
    </div>
    <div class="categories-scroll">
        <button class="cat-chip active" onclick="filterCategory('todos', this)"><i class="fas fa-border-all"></i> Todos</button>
        <button class="cat-chip" onclick="filterCategory('platos', this)"><i class="fas fa-utensils"></i> Platos</button>
        <button class="cat-chip" onclick="filterCategory('vasos', this)"><i class="fas fa-glass-whiskey"></i> Vasos</button>
        <button class="cat-chip" onclick="filterCategory('cubiertos', this)"><i class="fas fa-spoon"></i> Cubiertos</button>
        <button class="cat-chip" onclick="filterCategory('bandejas', this)"><i class="fas fa-box"></i> Bandejas</button>
        <button class="cat-chip" onclick="filterCategory('contenedores', this)"><i class="fas fa-box-open"></i> Contenedores</button>
    </div>

    <!-- BRANDS -->
    <div class="section-title">
        <h3><i class="fas fa-copyright"></i> Marcas</h3>
    </div>
    <div class="brands-scroll" id="brandsContainer">
        <!-- Injected by JS -->
    </div>

    <!-- PRODUCTS GRID -->
    <div class="section-title">
        <h3><i class="fas fa-fire"></i> Catálogo Principal</h3>
        <span id="prodCountLabel">Cargando...</span>
    </div>

    <div class="products-grid" id="appProductsGrid">
        <!-- Dynamic Cards -->
    </div>

    <!-- BOTTOM NAVBAR -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchNav(this, 'inicio')">
            <i class="fas fa-home"></i>
            <span>Inicio</span>
        </button>
        <button class="nav-item" onclick="switchNav(this, 'catalogo')">
            <i class="fas fa-store"></i>
            <span>Catálogo</span>
        </button>
        <button class="nav-item" onclick="switchNav(this, 'puntos')">
            <i class="fas fa-gift"></i>
            <span>Puntos</span>
        </button>
        <button class="nav-item" onclick="openCartModal()">
            <i class="fas fa-shopping-cart"></i>
            <span>Carrito</span>
        </button>
    </nav>

    <!-- CART MODAL SHEET -->
    <div class="modal-sheet" id="cartSheet">
        <div class="sheet-content">
            <div class="sheet-handle"></div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                <h3 style="font-size:1.2rem; font-weight:900;"><i class="fas fa-shopping-bag" style="color:var(--accent-gold-dark);"></i> Mi Carrito</h3>
                <button onclick="closeCartModal()" style="background:none; border:none; font-size:1.4rem; cursor:pointer; color:#888;">&times;</button>
            </div>
            <div id="cartItemsList" style="display:flex; flex-direction:column; gap:12px; margin-bottom:20px;">
                <!-- Cart items -->
            </div>
            <div style="border-top:1px solid var(--border); padding-top:14px; display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                <span style="font-weight:700; color:var(--text-muted);">Total estimado:</span>
                <strong style="font-size:1.3rem; font-weight:900; color:var(--primary);" id="cartTotalVal">RD$ 0.00</strong>
            </div>
            <button onclick="alert('Redirigiendo a Pasarela Azul...')" style="width:100%; padding:15px; background:var(--primary); color:#fff; border:none; border-radius:14px; font-weight:900; font-size:0.95rem; text-transform:uppercase; letter-spacing:1px; cursor:pointer;">
                Proceder al Pago
            </button>
        </div>
    </div>

    <!-- SUPABASE CONFIG & JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script>
        let appProducts = [];
        let cart = [];
        let selectedCategory = 'todos';
        let selectedBrand = '';
        let searchQuery = '';

        // Instant Cache + Supabase Live Sync
        async function initAppProducts() {
            const cached = localStorage.getItem('ivad_custom_products');
            if (cached) {
                try {
                    appProducts = JSON.parse(cached);
                    renderAppGrid();
                    renderBrandsChips();
                } catch(e){}
            }

            if (typeof supabaseClient !== 'undefined' && supabaseClient) {
                try {
                    const { data, error } = await supabaseClient.from('products').select('*').order('id', { ascending: true });
                    if (!error && data) {
                        appProducts = data;
                        localStorage.setItem('ivad_custom_products', JSON.stringify(appProducts));
                        renderAppGrid();
                        renderBrandsChips();
                    }
                } catch(err) {
                    console.error("Error loading products from Supabase:", err);
                }
            }
        }

        function extractBrand(p) {
            if (p.brand && p.brand.trim()) return p.brand.trim();
            if (Array.isArray(p.features)) {
                for (const f of p.features) {
                    const clean = f.replace(/<[^>]*>/g, '');
                    const match = clean.match(/Marca:\s*([^|,<]+)/i);
                    if (match && match[1]) return match[1].trim();
                }
            }
            return 'General';
        }

        function renderBrandsChips() {
            const container = document.getElementById('brandsContainer');
            if (!container) return;

            const brands = Array.from(new Set(appProducts.map(extractBrand))).sort();
            container.innerHTML = `<button class="brand-chip ${selectedBrand===''?'active':''}" onclick="filterBrand('', this)">Todas</button>`;
            brands.forEach(b => {
                container.innerHTML += `<button class="brand-chip ${selectedBrand===b?'active':''}" onclick="filterBrand('${b}', this)">${b}</button>`;
            });
        }

        function filterCategory(cat, el) {
            selectedCategory = cat;
            if (el) {
                document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
                el.classList.add('active');
            }
            renderAppGrid();
        }

        function filterBrand(brand, el) {
            selectedBrand = brand;
            if (el) {
                document.querySelectorAll('.brand-chip').forEach(b => b.classList.remove('active'));
                el.classList.add('active');
            }
            renderAppGrid();
        }

        function onAppSearch(val) {
            searchQuery = val.toLowerCase().trim();
            renderAppGrid();
        }

        function renderAppGrid() {
            const grid = document.getElementById('appProductsGrid');
            if (!grid) return;

            const filtered = appProducts.filter(p => {
                const b = extractBrand(p);
                const titleLower = (p.title || '').toLowerCase();
                const matchCat = selectedCategory === 'todos' || p.sub_category === selectedCategory;
                const matchBrand = !selectedBrand || b === selectedBrand;
                const matchSearch = !searchQuery || titleLower.includes(searchQuery) || b.toLowerCase().includes(searchQuery);
                return matchCat && matchBrand && matchSearch;
            });

            document.getElementById('prodCountLabel').textContent = `${filtered.length} artículos`;

            if (filtered.length === 0) {
                grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:40px; color:#94a3b8;">No se encontraron productos.</div>`;
                return;
            }

            grid.innerHTML = filtered.map(p => {
                const b = extractBrand(p);
                return `
                    <div class="product-card">
                        <div>
                            <div class="prod-img-wrap">
                                <img src="${p.img}" alt="${p.title}">
                            </div>
                            <span class="prod-brand">${b}</span>
                            <h4 class="prod-title">${p.title}</h4>
                        </div>
                        <div class="prod-bottom">
                            <span class="prod-price">${p.price}</span>
                            <button class="btn-add-cart" onclick="addToCart('${p.id}')">
                                <i class="fas fa-plus"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function addToCart(id) {
            const p = appProducts.find(item => item.id === id);
            if (!p) return;
            cart.push(p);
            document.getElementById('cartBadgeCount').textContent = cart.length;
        }

        function openCartModal() {
            const sheet = document.getElementById('cartSheet');
            const list = document.getElementById('cartItemsList');
            const totalEl = document.getElementById('cartTotalVal');

            if (cart.length === 0) {
                list.innerHTML = `<p style="text-align:center; padding:20px; color:#888;">El carrito está vacío.</p>`;
                totalEl.textContent = 'RD$ 0.00';
            } else {
                let sum = 0;
                list.innerHTML = cart.map(item => {
                    sum += item.price_num || 0;
                    return `
                        <div style="display:flex; align-items:center; gap:12px; background:#f8fafc; padding:10px; border-radius:12px;">
                            <img src="${item.img}" style="width:45px; height:45px; object-fit:contain; background:#fff; border-radius:8px; padding:2px;">
                            <div style="flex:1;">
                                <strong style="font-size:0.85rem; display:block;">${item.title}</strong>
                                <span style="font-size:0.78rem; color:var(--primary); font-weight:800;">${item.price}</span>
                            </div>
                        </div>
                    `;
                }).join('');
                totalEl.textContent = `RD$ ${sum.toFixed(2)}`;
            }

            sheet.classList.add('open');
        }

        function closeCartModal() {
            document.getElementById('cartSheet').classList.remove('open');
        }

        function switchNav(btn, sec) {
            document.querySelectorAll('.bottom-nav .nav-item').forEach(i => i.classList.remove('active'));
            btn.classList.add('active');
        }

        window.addEventListener('DOMContentLoaded', () => {
            initAppProducts();
        });
    </script>
</body>
</html>
